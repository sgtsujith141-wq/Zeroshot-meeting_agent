[project]
name = "ps53-meeting-agent"
version = "0.1.0"
description = "PS 5.3 Meeting-to-Action Tracker Agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "google-genai>=1.40",
    "sarvamai>=0.1.20",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
